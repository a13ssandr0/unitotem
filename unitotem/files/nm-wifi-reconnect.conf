# A Wi-Fi profile is retried for as long as it takes. NetworkManager's default stops autoconnecting a profile after
# 4 failed activations (retried again after 300 s), so an access point that is off for a few minutes would keep the unit
# offline for longer than needed. autoconnect-retries-default=0 means forever (nm-manager.c, _autoconnect_retries_initial).
# The radio never enters power save (wifi.powersave=2): a kiosk is mains powered, and power save adds latency and drops.
[main]
autoconnect-retries-default=0

[connection]
wifi.powersave=2
