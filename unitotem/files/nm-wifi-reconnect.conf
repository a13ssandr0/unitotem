# A Wi-Fi profile is retried for as long as it takes. NetworkManager's default stops autoconnecting a profile after
# 4 failed activations, so an access point that is off for a few minutes would leave the unit offline for good.
# The radio never enters power save (wifi.powersave=2): a kiosk is mains powered, and power save adds latency and drops.
[connection]
connection.autoconnect-retries=0
wifi.powersave=2
