# UniTotem network watchdog (unitotem/files/unitotem-net-watchdog).
#
# ENABLED=0 disables it entirely: for a unit that must stay cabled without an address
# on purpose, without being rebooted into recovery mode.
#
# THRESHOLD_MIN is the number of consecutive minutes with the cable connected and no global
# address before OTA is re-armed. Keep it high: a low value can reboot while a slow DHCP is still
# answering or while someone is fixing the configuration over link-local.
ENABLED=1
THRESHOLD_MIN=15
