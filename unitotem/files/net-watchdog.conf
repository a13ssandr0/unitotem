# Watchdog di rete UniTotem (unitotem/files/unitotem-net-watchdog).
#
# ENABLED=0 lo disattiva del tutto: da fare su un totem che deve poter
# restare cablato ma senza indirizzo per scelta, senza che questo lo riavvii
# in modalita' di recupero.
#
# THRESHOLD_MIN sono i minuti consecutivi con cavo collegato e nessun
# indirizzo globale prima di riarmare l'OTA. Tenerlo alto: un valore basso
# rischia di riavviare mentre un DHCP lento sta ancora rispondendo, o mentre
# qualcuno sta gia' correggendo la configurazione via link-local.
ENABLED=1
THRESHOLD_MIN=15
