# UniTotem network watchdog (unitotem/files/unitotem-net-watchdog).
#
# ENABLED=0 disables it entirely (for a unit that must stay cabled without an address, without being rebooted).
# THRESHOLD_MIN: consecutive minutes with carrier and no global address before OTA is re-armed. Keep it high so a
# slow DHCP or someone fixing the configuration over link-local is not rebooted.
ENABLED=1
THRESHOLD_MIN=15
