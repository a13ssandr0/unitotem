[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=512M
RuntimeMaxUse=64M
SyncIntervalSec=5min
# The manager's stderr is logged at priority INFO (even its warnings), so 'warning' here dropped ALL of its output: a crash loop left no trace.
# Measured: ~210 lines / 31 KB in the first two minutes, almost all at startup, nearly silent afterwards - cheap enough for the SD card.
MaxLevelStore=info
