# Image drop-in for the Raspberry Pi OS rpi-eeprom package: stages the bundled bootloader EEPROM once the network and the clock are up,
# with the boot FAT writable only for the run. Skips are not failures. Boards without an EEPROM bootloader (Pi 3) skip by condition.
[Unit]
After=multi-user.target network-online.target time-sync.target
Wants=network-online.target
ConditionPathExists=/proc/device-tree/chosen/bootloader/build-timestamp

[Service]
TimeoutStartSec=150
ExecCondition=/usr/lib/unitotem/eeprom-update check
ExecStart=
ExecStart=/usr/lib/unitotem/eeprom-update run
ExecStartPost=/usr/lib/unitotem/eeprom-update ro
ExecStopPost=/usr/lib/unitotem/eeprom-update ro
SuccessExitStatus=3
Nice=19
IOSchedulingClass=idle
