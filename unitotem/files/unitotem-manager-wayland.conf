# Drop-in for the unitotem-manager package's unit (not part of the package: it is about how THIS image starts the session).
# The viewer decides at start whether a local display exists, so the manager must start after the compositor and wait (up to 60 s) for its
# Wayland socket; Type=notify's TimeoutStartSec (300 s) is far above that. The environment (XDG_RUNTIME_DIR=/run/unitotem/xdg,
# WAYLAND_DISPLAY=/run/unitotem/xdg/wayland-0, and XDG_RUNTIME_DIR=/run/user/0 so libpulse/pulsectl find root's PipeWire) comes from the
# unitotem-node deb's 10-wayland.conf. The manager also starts after root's user manager (user@0.service), which hosts PipeWire.
[Unit]
After=unitotem-compositor.service user@0.service
Wants=unitotem-compositor.service user@0.service

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -S /run/unitotem/xdg/wayland-0 ] && [ $i -lt 300 ]; do sleep 0.2; i=$((i+1)); done'
