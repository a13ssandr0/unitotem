[Daemon]
# The boot splash is the theme shipped by the unitotem-manager package. This file is installed by stage 2
# after the package, and stage 2 ends with `update-initramfs -u -k all`: without Theme= here the initramfs
# gets the fallback "text" theme. If the theme is not installed plymouthd uses its own default.
Theme=unitotem
ShowDelay=0
DeviceTimeout=8
