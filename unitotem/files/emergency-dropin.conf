# Installed as emergency.service.d/unitotem.conf and rescue.service.d/unitotem.conf (unitotem/stage2-configure.sh).
# An appliance has nobody at its console: emergency mode waiting forever for a root password is a dead end. Keep
# the shell for whoever is there (sulogin gives up after two minutes), then reboot. A/B images retry the normal
# boot; the OTA fallback is where the boot checks send a device whose ROOT is really unusable.
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 120 /usr/lib/systemd/systemd-sulogin-shell emergency
ExecStopPost=-/usr/bin/systemctl --no-block reboot
