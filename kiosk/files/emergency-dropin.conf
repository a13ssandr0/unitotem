# Installed as emergency.service.d/unitotem.conf and rescue.service.d/unitotem.conf (kiosk/stage2-configure.sh).
#
# An appliance has nobody at its console: systemd's emergency mode, which waits for a root password forever, is a
# dead end - and on a Pi without a keyboard it was exactly where a totem hit by repeated power cuts stayed. Keep the
# shell for whoever IS there (sulogin gives up after two minutes), then reboot.
#
# What the reboot lands on depends on the layout: A/B images retry the normal boot, and the OTA fallback (reachable
# over the network, see ota-engine.sh) is what the boot checks send a device to when ROOT really is unusable.
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 120 /usr/lib/systemd/systemd-sulogin-shell emergency
ExecStopPost=-/usr/bin/systemctl --no-block reboot
