[Daemon]
# The boot splash is the theme shipped by the unitotem-manager package. This file is installed by stage 2 AFTER the package, and
# stage 2 ends with `update-initramfs -u -k all`: without Theme= here the initramfs was built with the fallback "text" theme
# (grey-green screen with "...", no script.so) even though the package had selected "unitotem" (found 2026-10-12 on the Pi).
# If the theme is not installed (an image without the manager) plymouthd falls back to its own default.
Theme=unitotem
ShowDelay=0
DeviceTimeout=8
