# Drop-in for the unitotem-manager package's unit (not part of the package: it is about how THIS image starts X).
# The viewer decides at start whether a local display exists. X now starts right after plymouth-quit (t~16 s) while the manager used to start
# earlier (t~13 s), so without this the viewer could conclude "no display" a few seconds too early and run without windows. Order after X
# and wait (up to 60 s) for its socket; Type=notify's TimeoutStartSec (300 s) is far above that.
[Unit]
After=start-xorg.service
Wants=start-xorg.service

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -S /tmp/.X11-unix/X0 ] && [ $i -lt 300 ]; do sleep 0.2; i=$((i+1)); done'
