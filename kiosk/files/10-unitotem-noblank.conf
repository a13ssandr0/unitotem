# A kiosk screen never blanks or powers down by itself. These are the X server's own defaults before any client runs, so they hold
# even if xset is missing (the 2026.10.10/.11 arm64 images lost xset and went black after the 10-minute default). The manager still
# switches outputs off and on on purpose (xset dpms force / xrandr), which these zero timeouts do not prevent.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
